name: Moodle Plugin CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mariadb:
        image: mariadb:11
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.1', moodle-branch: 'MOODLE_405_STABLE', database: pgsql}
          - {php: '8.2', moodle-branch: 'MOODLE_405_STABLE', database: mariadb}
          - {php: '8.3', moodle-branch: 'MOODLE_500_STABLE', database: pgsql}
          - {php: '8.3', moodle-branch: 'MOODLE_502_STABLE', database: mariadb}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, gd, iconv, intl, json, mbstring, openssl, pgsql, mysqli, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install moodle-plugin-ci
        run: |
          composer global require moodlehq/moodle-plugin-ci
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Run moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin plugin --moodle-branch ${{ matrix.moodle-branch }} --db-type ${{ matrix.database }}
          moodle-plugin-ci phplint
          moodle-plugin-ci phpcpd
          moodle-plugin-ci phpmd
          moodle-plugin-ci codechecker
          moodle-plugin-ci phpdoc
          moodle-plugin-ci validate
          moodle-plugin-ci savepoints
          moodle-plugin-ci mustache
          moodle-plugin-ci phpunit
