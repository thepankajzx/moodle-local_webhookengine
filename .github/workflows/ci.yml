name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.1', database: 'pgsql', db-port: 5432, db-user: 'postgres'}
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.2', database: 'mariadb', db-port: 3306, db-user: 'root'}
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'mysqli', db-port: 3307, db-user: 'root'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql', db-port: 5432, db-user: 'postgres'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.3', database: 'mariadb', db-port: 3306, db-user: 'root'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.2', database: 'mariadb', db-port: 3306, db-user: 'root'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.3', database: 'mysqli', db-port: 3307, db-user: 'root'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql', db-port: 5432, db-user: 'postgres'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'mariadb', db-port: 3306, db-user: 'root'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'mysqli', db-port: 3307, db-user: 'root'}

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping || mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Generate Locale
        run: sudo locale-gen en_AU.UTF-8

      - name: Check out plugin repository
        uses: actions/checkout@v4
        with:
          path: local_webhookengine

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, xml, sodium, mysqli, pgsql, zip, gd
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci && pwd)/bin" >> $GITHUB_PATH

      - name: Install Moodle and Plugin
        run: moodle-plugin-ci install --plugin local_webhookengine --branch ${{ matrix.moodle-branch }} --db-type ${{ matrix.database }} --db-host 127.0.0.1 --db-port ${{ matrix.db-port }} --db-user ${{ matrix.db-user }}

      - name: Code Checker (PHPCS)
        run: moodle-plugin-ci codechecker

      - name: Validate (validate.php)
        run: moodle-plugin-ci validate

      - name: PHPUnit Tests
        run: moodle-plugin-ci phpunit
