name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.1', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.2', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'mysqli'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.3', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.2', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.3', database: 'mysqli'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'mysqli'}

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping || mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      pgsql:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Check out plugin repository
        uses: actions/checkout@v4
        with:
          path: local_webhookengine

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, xml, sodium, mysqli, pgsql, zip, gd
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci && pwd)/bin" >> $GITHUB_PATH

      - name: Install Moodle and Plugin
        run: moodle-plugin-ci install --plugin local_webhookengine --branch ${{ matrix.moodle-branch }} --db-type ${{ matrix.database }}

      - name: Code Checker (PHPCS)
        run: moodle-plugin-ci codechecker

      - name: Validate (validate.php)
        run: moodle-plugin-ci validate

      - name: PHPUnit Tests
        run: moodle-plugin-ci phpunit
